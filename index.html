<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect } = React;

/* Bump this (and the matching version.json) on every deploy so open tabs get
   prompted to reload instead of running stale code silently. */
const APP_VERSION = "2026-08-14.4";
function useVersionCheck() {
  const [updateAvailable, setUpdateAvailable] = useState(false);
  useEffect(() => {
    const check = async () => {
      try {
        const res = await fetch("version.json?_=" + Date.now(), { cache: "no-store" });
        const data = await res.json();
        if (data.version && data.version !== APP_VERSION) setUpdateAvailable(true);
      } catch (e) {}
    };
    check();
    const onVis = () => { if (document.visibilityState === "visible") check(); };
    document.addEventListener("visibilitychange", onVis);
    const interval = setInterval(check, 45000);
    return () => { document.removeEventListener("visibilitychange", onVis); clearInterval(interval); };
  }, []);
  return updateAvailable;
}

/* ---------- Firebase Realtime Database (REST, no SDK) ---------- */
const DB_URL = "https://scs-toilet-truck-default-rtdb.asia-southeast1.firebasedatabase.app";

/* Paste your Firebase project's Web API Key here (Firebase console → Project settings
   → General → "Web API Key"). Required for Sign up / Log in to work. */
const FIREBASE_API_KEY = "AIzaSyDuYrFItf05RW9GhsM2vpxni18boAU0QzY";

const AUTH_SIGNUP_URL = `https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FIREBASE_API_KEY}`;
const AUTH_SIGNIN_URL = `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FIREBASE_API_KEY}`;
const AUTH_REFRESH_URL = `https://securetoken.googleapis.com/v1/token?key=${FIREBASE_API_KEY}`;

let CURRENT_ID_TOKEN = null;
function setCurrentIdToken(token) { CURRENT_ID_TOKEN = token; }

async function fbSet(path, id, value) {
  const authQ = CURRENT_ID_TOKEN ? `?auth=${CURRENT_ID_TOKEN}` : "";
  const res = await fetch(`${DB_URL}/${path}/${id}.json${authQ}`, { method: "PUT", body: JSON.stringify(value) });
  if (!res.ok) throw new Error("Firebase write failed: " + res.status);
  return res.json();
}
async function fbGet(path) {
  const authQ = CURRENT_ID_TOKEN ? `?auth=${CURRENT_ID_TOKEN}` : "";
  const res = await fetch(`${DB_URL}/${path}.json${authQ}`);
  if (!res.ok) throw new Error("Firebase read failed: " + res.status);
  return res.json();
}
async function fbGetAll(path) {
  const data = await fbGet(path);
  return data ? Object.values(data) : [];
}

/* Checks whether the car just logged already has 2+ repair-flagged services
   within the last 7 days (including the one just submitted). */
async function checkReoccurringCar(car, excludeId) {
  if (!car) return 0;
  const weekMs = 7 * 24 * 60 * 60 * 1000;
  const now = Date.now();
  const services = await fbGetAll("services");
  return services.filter((s) => s.car === car && s.repairRequired && s.id !== excludeId && now - (s.submittedAt || 0) <= weekMs).length;
}

/* ---------- Auth REST calls ---------- */
async function authSignUp(email, password) {
  const res = await fetch(AUTH_SIGNUP_URL, { method: "POST", body: JSON.stringify({ email, password, returnSecureToken: true }) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || "Sign up failed");
  return data;
}
async function authSignIn(email, password) {
  const res = await fetch(AUTH_SIGNIN_URL, { method: "POST", body: JSON.stringify({ email, password, returnSecureToken: true }) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || "Log in failed");
  return data;
}
async function authRefresh(refreshToken) {
  const res = await fetch(AUTH_REFRESH_URL, {
    method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(refreshToken)}`,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || "Session refresh failed");
  return { idToken: data.id_token, refreshToken: data.refresh_token, localId: data.user_id };
}
function authErrorMessage(err) {
  const code = err.message || "";
  if (code.includes("EMAIL_EXISTS")) return "An account with that email already exists.";
  if (code.includes("EMAIL_NOT_FOUND") || code.includes("INVALID_PASSWORD") || code.includes("INVALID_LOGIN_CREDENTIALS")) return "Incorrect email or password.";
  if (code.includes("WEAK_PASSWORD")) return "Password must be at least 6 characters.";
  if (code.includes("INVALID_EMAIL")) return "That doesn't look like a valid email address.";
  if (code.includes("PASTE_YOUR_WEB_API_KEY")) return "App isn't configured yet — missing Firebase Web API Key.";
  return "Something went wrong. Please try again.";
}

/* ---------- Session persistence (remember me → localStorage, otherwise sessionStorage) ---------- */
const SESSION_KEY = "sxs-ledger:session";
function saveSession(session, remember) {
  try {
    const store = remember ? localStorage : sessionStorage;
    store.setItem(SESSION_KEY, JSON.stringify(session));
    (remember ? sessionStorage : localStorage).removeItem(SESSION_KEY);
  } catch (e) {}
}
function loadSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function clearSession() {
  try { localStorage.removeItem(SESSION_KEY); sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
}

async function saveOperatorProfile(uid, profile) { return fbSet("operators", uid, profile); }
async function fetchOperatorProfile(uid) { return fbGet(`operators/${uid}`); }

/* ---------- Offline queue (localStorage) ---------- */
const QUEUE_KEY = "sxs-ledger:queue";
function loadQueue() { try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || "[]"); } catch (e) { return []; } }
function saveQueue(q) { try { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); } catch (e) {} }
async function fbSetQueued(path, id, value) {
  try {
    await fbSet(path, id, value);
    return true;
  } catch (e) {
    const q = loadQueue();
    q.push({ path, id, value });
    saveQueue(q);
    return false;
  }
}
async function flushQueue(onItemFlushed) {
  const q = loadQueue();
  if (q.length === 0) return 0;
  const remaining = [];
  let flushed = 0;
  for (const item of q) {
    try { await fbSet(item.path, item.id, item.value); flushed++; onItemFlushed && onItemFlushed(item); }
    catch (e) { remaining.push(item); }
  }
  saveQueue(remaining);
  return flushed;
}

/* ---------- Last-used prefs (localStorage) ---------- */
function loadPref(key, fallback) { try { return localStorage.getItem("sxs-ledger:" + key) || fallback; } catch (e) { return fallback; } }
function savePref(key, value) { try { localStorage.setItem("sxs-ledger:" + key, value); } catch (e) {} }

/* ---------- Car-number auto logic ---------- */
function getCarOptions(trainType, fleetNo) {
  if (!fleetNo) return [];
  if (trainType === "VLocity BG" || trainType === "VLocity SG") {
    const m = fleetNo.match(/\d+/);
    const num = m ? parseInt(m[0], 10) : null;
    if (num === null) return [];
    if (num >= 100) {
      const suffix = String(num % 100).padStart(2, "0");
      return [`21${suffix}`, `22${suffix}`];
    }
    const suffix = String(num).padStart(2, "0");
    return [`11${suffix}`, `12${suffix}`];
  }
  if (trainType === "Sprinter" || trainType === "Locomotive") return [fleetNo];
  if (trainType === "N-Set") {
    const map = {
      VN10: ["ACN30", "BRN29", "BN28", "BZN274", "BZN276"],
      VN12: ["ACN36", "BRN35", "BN23", "BDN50", "BZN266"],
      VN14: ["ACN42", "BRN41", "BN14", "BZN258", "BZN262"],
      VN17: ["ACN51", "BRN31", "BN4", "BZN265", "BZN273"],
      VN19: ["ACN57", "BRN56", "BN55", "BZN271", "BDN6"],
    };
    return map[fleetNo] || [];
  }
  return [];
}

function FaultDetails({ f, set }) {
  const flags = f.faultFlags || [];
  const [showMore, setShowMore] = useState(false);
  const toggleFlag = (flag) => {
    const next = flags.includes(flag) ? flags.filter((x) => x !== flag) : [...flags, flag];
    set("faultFlags", next);
    if (flag === "Requires change out" && next.includes(flag)) set("reported", true);
  };
  const selected = TOILET_FAULT_CODES.find((c) => c.code === f.faultCode);

  const renderFlag = (flag) => {
    const active = flags.includes(flag);
    const isChangeOut = flag === "Requires change out";
    return (
      <React.Fragment key={flag}>
        <div style={styles.checkItem} onClick={() => toggleFlag(flag)}>
          <div style={{ ...styles.checkbox, ...(active ? styles.checkboxOn : {}) }}>{active && <Icon path={ICONS.check} size={13} color="#0E1A16" />}</div>
          <span style={styles.checkItemLabel}>{flag}</span>
        </div>
        {isChangeOut && active && (
          <div style={styles.subQuestionStack}>
            <div style={styles.subQuestionBox} onClick={() => set("pumpedLocked", !f.pumpedLocked)}>
              <div style={{ ...styles.checkbox, ...(f.pumpedLocked ? styles.checkboxOn : {}) }}>{f.pumpedLocked && <Icon path={ICONS.check} size={13} color="#0E1A16" />}</div>
              <span style={styles.checkItemLabel}>Has the toilet been pumped?</span>
            </div>
            <div style={styles.subQuestionBox} onClick={() => set("deferred72h", !f.deferred72h)}>
              <div style={{ ...styles.checkbox, ...(f.deferred72h ? styles.checkboxOn : {}) }}>{f.deferred72h && <Icon path={ICONS.check} size={13} color="#0E1A16" />}</div>
              <span style={styles.checkItemLabel}>Has it been placed on 72hr deferment?</span>
            </div>
          </div>
        )}
      </React.Fragment>
    );
  };

  return (
    <div style={styles.faultBox}>
      {f.trainType === "Locomotive" ? (
        <div style={styles.faultCodeHint}>Locomotive toilets are mechanical (no electrical fault codes) — use the checklist below and notes for detail.</div>
      ) : (
        <Field label="Fault code">
          <select style={styles.select} value={f.faultCode} onChange={(e) => set("faultCode", e.target.value)}>
            <option value="">None / not shown</option>
            {TOILET_FAULT_CODES.map((c) => <option key={c.code} value={c.code}>CODE {c.code} — {c.name}</option>)}
          </select>
          {selected && <span style={styles.faultCodeHint}>{selected.description}</span>}
        </Field>
      )}
      <div style={styles.checkGrid}>
        {TOP_FLAGS.map(renderFlag)}
        {showMore && MORE_FLAGS.map(renderFlag)}
        <button type="button" style={styles.moreOptionsBtn} onClick={() => setShowMore((s) => !s)}>
          <Icon path={ICONS.chevronDown} size={13} style={{ marginRight: 5, transform: showMore ? "rotate(180deg)" : "none", transition: "transform .2s" }} />
          {showMore ? "Fewer options" : "More options"}
        </button>
      </div>
      <div style={styles.toggleRow} onClick={() => set("reported", !f.reported)}>
        <div style={{ ...styles.checkbox, ...(f.reported ? styles.checkboxOn : {}) }}>{f.reported && <Icon path={ICONS.check} size={13} color="#0E1A16" />}</div>
        <span style={styles.toggleLabel}>Reported to supervisor</span>
      </div>
      <PhotoUpload photo={f.photo} onChange={(v) => { set("photo", v); if (v) set("reported", true); }} />
    </div>
  );
}

function ServiceForm({ onSubmitted, onReoccurring, operatorName }) {
  const trucks = DEFAULT_TRUCKS, fleet = DEFAULT_FLEET;
  const blank = {
    date: todayISO(), truck: loadPref("lastTruck", trucks[0]), operator: operatorName,
    trainType: TRAIN_TYPES[0], fleetNo: "", car: "", serviceType: "Planned",
    repairRequired: false, faultCode: "", faultFlags: [], pumpedLocked: false, deferred72h: false,
    photo: null, reported: false, notes: "",
  };
  const [f, setF] = useState(blank);
  const [saving, setSaving] = useState(false);
  const set = (k, v) => setF((p) => ({ ...p, [k]: v }));

  const carOptions = getCarOptions(f.trainType, f.fleetNo);
  useEffect(() => {
    if (carOptions.length && !carOptions.includes(f.car)) set("car", carOptions[0]);
    if (!carOptions.length && f.car) set("car", "");
  }, [f.trainType, f.fleetNo]);
  useEffect(() => {
    if (f.trainType === "Locomotive" && f.faultCode) set("faultCode", "");
  }, [f.trainType]);

  const submit = async (e) => {
    e.preventDefault();
    if (!f.operator || !f.fleetNo || saving) return;
    setSaving(true);
    savePref("lastTruck", f.truck);
    const entry = { id: uid(), ...f, time: new Date().toTimeString().slice(0, 5), submittedAt: Date.now() };
    const ok = await fbSetQueued("services", entry.id, entry);
    onSubmitted(entry, "service", !ok);
    if (ok && entry.repairRequired && entry.car) {
      try {
        const priorCount = await checkReoccurringCar(entry.car, entry.id);
        if (priorCount >= 1 && onReoccurring) onReoccurring(entry, priorCount + 1);
      } catch (err) {}
    }
    setF({ ...blank, date: todayISO(), truck: f.truck });
    setSaving(false);
  };

  const vehicleOptions = fleet[f.trainType] || [];

  return (
    <form onSubmit={submit} style={styles.form}>
      <div className="desktop-2col" style={styles.formGrid}>
        <Field label="Truck"><select style={styles.select} value={f.truck} onChange={(e) => set("truck", e.target.value)}>{trucks.map((t) => <option key={t}>{t}</option>)}</select></Field>
        <Field label="Train type"><select style={styles.select} value={f.trainType} onChange={(e) => { set("trainType", e.target.value); set("fleetNo", ""); }}>{TRAIN_TYPES.map((t) => <option key={t}>{t}</option>)}</select></Field>
        <Field label="Vehicle number">
          <input style={styles.input} list="fleet-options" placeholder={f.trainType === "N-Set" ? "e.g. VN12" : "Type or pick"} value={f.fleetNo} onChange={(e) => set("fleetNo", e.target.value)} />
          <datalist id="fleet-options">{vehicleOptions.map((o) => <option key={o} value={o} />)}</datalist>
        </Field>
        <Field label="Operator"><input style={{ ...styles.input, color: "var(--amber-light)" }} value={f.operator} readOnly /></Field>

        <Field label="Date"><input style={styles.input} type="date" value={f.date} onChange={(e) => set("date", e.target.value)} /></Field>
        <Field label="Car number">
          {carOptions.length > 1 ? (
            <select style={styles.select} value={f.car} onChange={(e) => set("car", e.target.value)}>{carOptions.map((o) => <option key={o}>{o}</option>)}</select>
          ) : (
            <input style={{ ...styles.input, color: carOptions.length ? "var(--amber-light)" : "var(--muted)" }} value={carOptions.length ? carOptions[0] : "Select a vehicle first"} readOnly />
          )}
        </Field>
        <Field label="Service type">
          <div style={styles.segmented}>{["Planned", "Ad-hoc"].map((opt) => (<button type="button" key={opt} onClick={() => set("serviceType", opt)} style={{ ...styles.segmentedBtn, ...(f.serviceType === opt ? styles.segmentedBtnActive : {}) }}>{opt}</button>))}</div>
        </Field>
      </div>

      <div style={styles.toggleRow} onClick={() => set("repairRequired", !f.repairRequired)}>
        <div style={{ ...styles.checkbox, ...(f.repairRequired ? styles.checkboxOn : {}) }}>{f.repairRequired && <Icon path={ICONS.check} size={13} color="#0E1A16" />}</div>
        <span style={styles.toggleLabel}>Toilet requires repairs</span>
      </div>
      {f.repairRequired && <FaultDetails f={f} set={set} />}

      <details style={styles.notesDetails}>
        <summary style={styles.notesSummary}>Notes (optional)</summary>
        <textarea style={{ ...styles.textarea, marginTop: 8 }} placeholder="Anything else worth noting" value={f.notes} onChange={(e) => set("notes", e.target.value)} />
      </details>

      <button type="submit" disabled={saving} style={{ ...styles.submitBtn, opacity: saving ? 0.6 : 1 }}>
        <Icon path={ICONS.plus} size={16} style={{ marginRight: 6 }} />{saving ? "Saving…" : "Log service"}
      </button>
    </form>
  );
}

              {statusOptions.map((opt) => (<button type="button" key={opt} onClick={() => setCheck(item, opt)} style={{ ...styles.segmentedBtnSm, ...(f.checklist[item] === opt ? (opt === "Fail" ? styles.segmentedBtnFail : styles.segmentedBtnActive) : {}) }}>{opt}</button>))}
            </div>
          </div>
        ))}
      </div>

      <div style={{ ...styles.toggleRow, marginTop: 18 }} onClick={() => set("repairRequired", !f.repairRequired)}>
        <div style={{ ...styles.checkbox, ...(f.repairRequired ? styles.checkboxOn : {}) }}>{f.repairRequired && <Icon path={ICONS.check} size={13} color="#0E1A16" />}</div>
        <span style={styles.toggleLabel}>Fault identified — refer to Plant Maintenance Officer</span>
      </div>
      {f.repairRequired && <InspectionFaultDetails f={f} set={set} />}

      <details style={styles.notesDetails}>
        <summary style={styles.notesSummary}>Comments on ute condition (optional)</summary>
        <textarea style={{ ...styles.textarea, marginTop: 8 }} value={f.notes} onChange={(e) => set("notes", e.target.value)} />
      </details>

      <button type="submit" disabled={saving} style={{ ...styles.submitBtn, opacity: saving ? 0.6 : 1 }}>
        <Icon path={ICONS.plus} size={16} style={{ marginRight: 6 }} />{saving ? "Saving…" : "Save inspection"}
      </button>
    </form>
  );
}

function LoginPage({ onAuthed }) {
  const [mode, setMode] = useState("login"); // "login" | "signup"
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [showPassword, setShowPassword] = useState(false);
  const [rememberMe, setRememberMe] = useState(true);
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setError("");
    if (!email || !password) { setError("Enter your email and password."); return; }
    if (mode === "signup" && !name.trim()) { setError("Enter your name so entries can be attributed to you."); return; }
    setBusy(true);
    try {
      let auth;
      if (mode === "signup") {
        auth = await authSignUp(email, password);
        setCurrentIdToken(auth.idToken);
        const autoApproved = email.trim().toLowerCase().endsWith("@alstomgroup.com");
        await saveOperatorProfile(auth.localId, { name: name.trim(), email, status: autoApproved ? "approved" : "pending", createdAt: Date.now() });
      } else {
        auth = await authSignIn(email, password);
        setCurrentIdToken(auth.idToken);
      }
      const profile = (await fetchOperatorProfile(auth.localId)) || { name: email.split("@")[0], email, status: "pending" };
      const session = { uid: auth.localId, idToken: auth.idToken, refreshToken: auth.refreshToken, email, name: profile.name || email.split("@")[0], status: profile.status || "pending" };
      saveSession(session, rememberMe);
      onAuthed(session);
    } catch (err) {
      setError(authErrorMessage(err));
    }
    setBusy(false);
  };

  return (
    <div style={styles.loginWrap}>
      <div className="rise" style={styles.loginCard}>
        <div style={styles.loginLogoRow}>
          <div style={styles.logoMark}><Icon path={ICONS.gauge} size={24} color="#0E1A16" /></div>
          <div>
            <div style={styles.title}>SOUTHERN CROSS STATION</div>
            <div style={styles.subtitle}>Operator Login</div>
          </div>
        </div>

        <div style={styles.loginTabs}>
          {["login", "signup"].map((m) => (
            <button key={m} type="button" onClick={() => { setMode(m); setError(""); }} style={styles.loginTab}>
              {m === "login" ? "Log In" : "Sign Up"}
              {mode === m && <span style={styles.loginTabUnderline} />}
            </button>
          ))}
        </div>

        <form onSubmit={submit}>
          {mode === "signup" && (
            <Field label="Your name">
              <div style={styles.inputWithIcon}>
                <Icon path={ICONS.user} size={15} color="var(--muted)" style={styles.inputIcon} />
                <input style={styles.inputIndented} placeholder="Full name" value={name} onChange={(e) => setName(e.target.value)} />
              </div>
            </Field>
          )}
          <Field label="Email">
            <div style={styles.inputWithIcon}>
              <Icon path={ICONS.mail} size={15} color="var(--muted)" style={styles.inputIcon} />
              <input style={styles.inputIndented} type="email" autoCapitalize="none" placeholder="you@example.com" value={email} onChange={(e) => setEmail(e.target.value)} />
            </div>
            {mode === "signup" && <span style={styles.fieldHint}>@alstomgroup.com addresses are approved automatically</span>}
          </Field>
          <Field label="Password">
            <div style={styles.inputWithIcon}>
              <Icon path={ICONS.lock} size={15} color="var(--muted)" style={styles.inputIcon} />
              <input style={{ ...styles.inputIndented, paddingRight: 40 }} type={showPassword ? "text" : "password"} placeholder="••••••••" value={password} onChange={(e) => setPassword(e.target.value)} />
              <button type="button" style={styles.eyeToggle} onClick={() => setShowPassword((s) => !s)} aria-label="Show password">
                <Icon path={showPassword ? ICONS.eyeOff : ICONS.eye} size={16} color="var(--muted)" />
              </button>
            </div>
          </Field>

          <div style={styles.rememberRow} onClick={() => setRememberMe((r) => !r)}>
            <div style={{ ...styles.checkbox, ...(rememberMe ? styles.checkboxOn : {}) }}>{rememberMe && <Icon path={ICONS.check} size={13} color="#0E1A16" />}</div>
            <span style={styles.toggleLabel}>Remember me</span>
          </div>

          {error && <div style={styles.loginError}><Icon path={ICONS.alert} size={13} style={{ marginRight: 6, flexShrink: 0 }} />{error}</div>}

          <button type="submit" disabled={busy} style={{ ...styles.submitBtn, opacity: busy ? 0.6 : 1 }}>
            {busy ? "Please wait…" : mode === "login" ? "Log In" : "Sign Up"}
          </button>
        </form>
      </div>
    </div>
  );
}

function BugReportModal({ session, onClose, showToast }) {
  const [description, setDescription] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    if (!description.trim() || busy) return;
    setBusy(true);
    try {
      await submitBugReport({
        description: description.trim(), reporterName: session.name, reporterEmail: session.email,
        page: "ledger", submittedAt: Date.now(), resolved: false,
      });
      showToast("Bug report sent — thanks for flagging it");
      onClose();
    } catch (e) {
      showToast("Couldn't send report — check your connection");
    }
    setBusy(false);
  };

  return (
    <div style={styles.modalOverlay} onClick={onClose}>
      <div className="rise" style={styles.modalCard} onClick={(e) => e.stopPropagation()}>
        <div style={styles.modalHeader}>
          <span style={styles.panelTitleText}>Report a bug</span>
          <button type="button" style={styles.signOutBtn} onClick={onClose}><Icon path={ICONS.x} size={14} color="var(--muted)" /></button>
        </div>
        <form onSubmit={submit}>
          <Field label="What went wrong?">
            <textarea style={{ ...styles.textarea, minHeight: 100 }} placeholder="Describe what happened, what you expected, and what screen you were on" value={description} onChange={(e) => setDescription(e.target.value)} autoFocus />
          </Field>
          <button type="submit" disabled={busy} style={{ ...styles.submitBtn, opacity: busy ? 0.6 : 1 }}>{busy ? "Sending…" : "Send report"}</button>
        </form>
      </div>
    </div>
  );
}

function App() {
  const updateAvailable = useVersionCheck();
  const [session, setSession] = useState(null);
  const [authChecked, setAuthChecked] = useState(false);
  const [tab, setTab] = useState("log");
  const [recent, setRecent] = useState([]);
  const [toast, setToast] = useState(null);
  const [online, setOnline] = useState(navigator.onLine);
  const [queueCount, setQueueCount] = useState(loadQueue().length);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2600); };

  // Restore session on load, refresh the ID token (it's only valid ~1hr)
  useEffect(() => {
    (async () => {
      const saved = loadSession();
      if (!saved) { setAuthChecked(true); return; }
      try {
        const refreshed = await authRefresh(saved.refreshToken);
        setCurrentIdToken(refreshed.idToken);
        const next = { ...saved, idToken: refreshed.idToken, refreshToken: refreshed.refreshToken };
        saveSession(next, !!localStorage.getItem(SESSION_KEY));
        setSession(next);
      } catch (e) {
        clearSession();
      }
      setAuthChecked(true);
    })();
  }, []);

  // Keep the token fresh every 45 minutes while signed in
  useEffect(() => {
    if (!session) return;
    const interval = setInterval(async () => {
      try {
        const refreshed = await authRefresh(session.refreshToken);
        setCurrentIdToken(refreshed.idToken);
        const next = { ...session, idToken: refreshed.idToken, refreshToken: refreshed.refreshToken };
        saveSession(next, !!localStorage.getItem(SESSION_KEY));
        setSession(next);
      } catch (e) {}
    }, 45 * 60 * 1000);
    return () => clearInterval(interval);
  }, [session]);

  const handleAuthed = (s) => setSession(s);
  const handleSignOut = () => {
    clearSession();
    setCurrentIdToken(null);
    setSession(null);
  };

  // Presence heartbeat — lets the Console's Admin tab show who's active right now
  useEffect(() => {
    if (!session || session.status !== "approved") return;
    const beat = () => fbSet("presence", session.uid, { name: session.name, email: session.email, lastSeen: Date.now() }).catch(() => {});
    beat();
    const interval = setInterval(beat, 60000);
    return () => clearInterval(interval);
  }, [session]);

  // Poll for approval while pending, so the operator doesn't need to manually re-login
  useEffect(() => {
    if (!session || session.status === "approved") return;
    const poll = setInterval(async () => {
      try {
        const profile = await fetchOperatorProfile(session.uid);
        if (profile && profile.status !== session.status) {
          const next = { ...session, status: profile.status, name: profile.name || session.name };
          saveSession(next, !!localStorage.getItem(SESSION_KEY));
          setSession(next);
        }
      } catch (e) {}
    }, 15000);
    return () => clearInterval(poll);
  }, [session]);

  const [bugModalOpen, setBugModalOpen] = useState(false);
  const [reoccurringAlert, setReoccurringAlert] = useState(null);
  const reoccurringTimer = useRef(null);
  const handleReoccurring = (entry, count) => {
    setReoccurringAlert({ entry, count });
    clearTimeout(reoccurringTimer.current);
    reoccurringTimer.current = setTimeout(() => setReoccurringAlert(null), 8000);
  };

  const onSubmitted = (entry, kind, queued) => {
    setRecent((r) => [{ ...entry, kind, queued }, ...r].slice(0, 5));
    setQueueCount(loadQueue().length);
    if (queued) showToast("Saved offline — will sync when connection returns");
    else showToast(kind === "service" ? "Service logged" : "Inspection saved");
  };

  useEffect(() => {
    if (!session || session.status !== "approved") return;
    const tryFlush = async () => {
      if (!navigator.onLine) return;
      const n = await flushQueue();
      if (n > 0) { setQueueCount(loadQueue().length); showToast(`Synced ${n} offline ${n === 1 ? "entry" : "entries"}`); }
    };
    tryFlush();
    const onOnline = () => { setOnline(true); tryFlush(); };
    const onOffline = () => setOnline(false);
    window.addEventListener("online", onOnline);
    window.addEventListener("offline", onOffline);
    const poll = setInterval(tryFlush, 20000);
    return () => { window.removeEventListener("online", onOnline); window.removeEventListener("offline", onOffline); clearInterval(poll); };
  }, [session]);

  if (!authChecked) return <div style={styles.app} />;
  if (!session) return <LoginPage onAuthed={handleAuthed} />;

  if (session.status === "pending") {
    return (
      <div style={styles.loginWrap}>
        <div className="rise" style={styles.loginCard}>
          <div style={styles.loginLogoRow}>
            <div style={styles.logoMark}><Icon path={ICONS.gauge} size={24} color="#0E1A16" /></div>
            <div><div style={styles.title}>SOUTHERN CROSS STATION</div><div style={styles.subtitle}>Awaiting Approval</div></div>
          </div>
          <p style={styles.statusMsg}>Hi {session.name}, your account is waiting on your supervisor to approve it. You'll get access automatically once that happens — no need to sign up again.</p>
          <button style={styles.submitBtn} onClick={handleSignOut}>Sign out</button>
        </div>
      </div>
    );
  }
  if (session.status === "rejected") {
    return (
      <div style={styles.loginWrap}>
        <div className="rise" style={styles.loginCard}>
          <div style={styles.loginLogoRow}>
            <div style={styles.logoMark}><Icon path={ICONS.gauge} size={24} color="#0E1A16" /></div>
            <div><div style={styles.title}>SOUTHERN CROSS STATION</div><div style={styles.subtitle}>Access Not Approved</div></div>
          </div>
          <p style={styles.statusMsg}>Your account request wasn't approved. Speak to your supervisor if you think this is wrong.</p>
          <button style={styles.submitBtn} onClick={handleSignOut}>Sign out</button>
        </div>
      </div>
    );
  }

  return (
    <div style={styles.app}>
      {reoccurringAlert && (
        <React.Fragment>
          <div className="flash-overlay" />
          <div className="flash-banner" onClick={() => setReoccurringAlert(null)}>
            <Icon path={ICONS.alert} size={16} color="#fff" style={{ marginRight: 8, flexShrink: 0 }} />
            <span><b>Re-occurring unit</b> — car {reoccurringAlert.entry.car} has had {reoccurringAlert.count} repair-flagged services this week</span>
          </div>
        </React.Fragment>
      )}
      <header style={styles.header}>
        <div style={styles.headerLeft}>
          <div style={styles.logoMark}><Icon path={ICONS.gauge} size={22} color="#0E1A16" /></div>
          <div>
            <div style={styles.title}>SOUTHERN CROSS STATION</div>
            <div style={styles.subtitle}>Toilet Truck Ledger</div>
          </div>
        </div>
        <div style={styles.accountBar}>
          <span style={{ ...styles.syncBadge, ...(!online || queueCount > 0 ? styles.syncBadgeWarn : {}) }}>
            <Icon path={online ? ICONS.cloud : ICONS.cloudOff} size={13} style={{ marginRight: 5 }} />
            {!online ? "Offline" : queueCount > 0 ? `Syncing ${queueCount}…` : "Synced"}
          </span>
          <button style={styles.signOutBtn} onClick={() => setBugModalOpen(true)} title="Report a bug"><Icon path={ICONS.bug} size={14} color="var(--muted)" /></button>
          <button style={styles.signOutBtn} onClick={handleSignOut} title="Sign out"><Icon path={ICONS.logout} size={14} color="var(--muted)" /></button>
        </div>
      </header>
      <div style={{ maxWidth: 720, margin: "0 auto", padding: "6px 16px 0" }}>
        <span style={styles.accountName}>Signed in as {session.name} ({session.email})</span>
      </div>

      <nav style={styles.tabBar}>
        {[{ id: "log", label: "Log service", icon: ICONS.wrench }, { id: "inspect", label: "Inspection", icon: ICONS.clipboard }].map((t) => (
          <button key={t.id} onClick={() => setTab(t.id)} style={{ ...styles.tabBtn, ...(tab === t.id ? styles.tabBtnActive : {}) }}>
            <Icon path={t.icon} size={16} style={{ marginRight: 6 }} />{t.label}
          </button>
        ))}
      </nav>

      <main style={styles.main}>
        {tab === "log" && <ServiceForm onSubmitted={onSubmitted} onReoccurring={handleReoccurring} operatorName={session.name} />}
        {tab === "inspect" && <InspectionForm onSubmitted={onSubmitted} operatorName={session.name} />}

        {recent.length > 0 && (
          <div style={{ marginTop: 26 }}>
            <div style={styles.sectionLabel}>Submitted this session</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {recent.map((r) => (
                <div key={r.id} className="rise" style={styles.recentCard}>
                  <Icon path={r.queued ? ICONS.cloudOff : ICONS.check} size={13} color={r.queued ? "var(--amber-light)" : "var(--ok)"} style={{ marginRight: 8, flexShrink: 0 }} />
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 13, fontWeight: 600 }}>{r.truck} — {r.kind === "service" ? `${r.trainType} ${r.fleetNo}` : "Daily inspection"}</div>
                    <div style={{ fontSize: 11.5, color: "var(--muted)" }}>{fmtDate(r.date)} · {r.operator}{r.queued ? " · queued offline" : ""}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        <div style={styles.offlineNote}>
          <Icon path={ICONS.cloudOff} size={13} style={{ marginRight: 6, flexShrink: 0 }} />
          If you're offline, data will save when connection returns
        </div>
      </main>

      {toast && <div style={styles.toast}>{toast}</div>}
      {bugModalOpen && <BugReportModal session={session} onClose={() => setBugModalOpen(false)} showToast={showToast} />}
      {updateAvailable && (
        <div style={styles.updateBanner}>
          <span><Icon path={ICONS.cloud} size={14} style={{ marginRight: 8 }} />A new version is available</span>
          <button style={styles.updateReloadBtn} onClick={() => window.location.reload()}>Reload</button>
        </div>
      )}
    </div>
  );
}
